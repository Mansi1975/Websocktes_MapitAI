<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FastAPI WebSocket Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }

    #chat {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #eee;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    #input {
      display: flex;
    }

    #input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #input button {
      margin-left: 10px;
      padding: 10px 20px;
      border: none;
      background: #007bff;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    #input button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
   <h2> WebSocket with FAST API</h2>
  <div id="chat">
    <div id="messages"></div>

    <div id="input">
      <input type="text" id="msg" placeholder="Type a message..." autocomplete="off" />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const ws = new WebSocket("ws://localhost:8000/ws");

    ws.onopen = () => {
      logMessage("✅ Connected to WebSocket server");
    };

    ws.onmessage = (event) => {
      logMessage("📩 " + event.data);
    };

    function sendMessage() {
      const input = document.getElementById("msg");
      const msg = input.value.trim();
      if (msg === "") return;

      ws.send(msg);
      logMessage("🧑 You: " + msg);
      input.value = "";
    }

    function logMessage(message) {
      const messagesDiv = document.getElementById("messages");
      const div = document.createElement("div");
      div.textContent = message;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
  <script src="wbst.js"></script>

</body>
</html>
